name: Native Windows indexed D3D7-on-D3D9 verification
on:
  push:
    branches: [work/d3d9-indexed-publication]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
      - name: Validate and publish exact owned source
        id: source
        shell: python
        run: |
          import base64,hashlib,lzma,os,subprocess
          from pathlib import Path
          base='75ef8dd08ca596ad8d986f1e7b9892c18fc87bf8'
          tree='d7d0cd964f4efae9f1ab892f0c2eef817ffbe8e1'
          def git(*args,cwd=None):return subprocess.check_output(['git',*args],cwd=cwd)
          data=git('show','HEAD:publication/indexed-source.b64')
          if hashlib.sha256(data).hexdigest()!='27133cfa1d64c855905ee19862cc457ab35280a590359137b3b926368ea9364b':
              raise RuntimeError('Encoded patch mismatch')
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(base64.b64decode(data,validate=True),max_length=1024*1024)
          if not decoder.eof or decoder.unused_data or hashlib.sha256(patch).hexdigest()!='f6f6de24b978600cbd4715820f7ec4b0499d0f52d1013cd8d267fb8c4b883db2':
              raise RuntimeError('Invalid or changed patch')
          path=Path(os.environ['RUNNER_TEMP'],'indexed.patch');path.write_bytes(patch)
          folder=Path(os.environ['RUNNER_TEMP'],'indexed-source')
          git('worktree','add','--detach',str(folder),base)
          git('apply','--index',str(path),cwd=folder)
          expected={'CMakeLists.txt','docs/indexed-rendering.md','include/winrecomp/d3d9_host.hpp','include/winrecomp/indexed_geometry.hpp','src/runtime/d3d9_host.cpp','src/runtime/directdraw.cpp','src/runtime/directdraw_d3d9.hpp','tests/d3d9_indexed.cpp','tests/d3d9_indexed_program.py','tests/d3d9_program.py','tests/indexed_geometry.cpp','verification/source-hashes.json'}
          if set(git('diff','--cached','--name-only',cwd=folder).decode().splitlines())!=expected:
              raise RuntimeError('Unexpected changed files')
          if git('write-tree',cwd=folder).decode().strip()!=tree:
              raise RuntimeError('Source tree mismatch')
          branch='refs/heads/work/d3d9-indexed'
          existing=git('ls-remote','origin',branch).decode().split()
          if existing:
              sha=existing[0];git('fetch','origin',sha,cwd=folder)
              if git('rev-parse',sha+'^{tree}',cwd=folder).decode().strip()!=tree:
                  raise RuntimeError('Development branch changed; no overwrite')
          else:
              git('config','user.name','github-actions[bot]',cwd=folder)
              git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com',cwd=folder)
              git('commit','-m','feat: translate checked WORD-indexed D3D7 triangles to native x64 D3D9','-m','Sparse indexed TL geometry, referenced-payload validation, texture edits and retained ownership. Original unindexed fixtures remain byte-identical. Windows cross-compilation and local portable tests completed; native Windows pixel and ASan acceptance follows. No game material or main-branch promotion.',cwd=folder)
              sha=git('rev-parse','HEAD',cwd=folder).decode().strip()
              git('push','origin','HEAD:'+branch,cwd=folder)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('source_sha='+sha+'\n')
          print('Published exact source',sha,tree)
  windows:
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          fetch-depth: 0
          submodules: false
      - run: git submodule update --init --recursive third_party/zydis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: python -m pip install unicorn==2.1.2
      - run: python tools/check_repository.py
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWINRECOMP_CONFORMANCE=ON
      - name: Compile current Windows source
        id: compile
        run: cmake --build build --parallel 2
      - name: Native Windows indexed boundaries and original x86 pixel comparisons
        run: ctest --test-dir build -R "^(indexed_geometry|d3d9_indexed|d3d9_indexed_program)$" --output-on-failure
      - name: Retain previous texture and runtime acceptance checks
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: ctest --test-dir build -R "^(d3d9_textures|d3d9_texture_program|d3d9_boundary|d3d9_program|gui_boundary|dialog_boundary|dialog_template|resources|exception_unwind|core|processor|modules|process|runtime|callback_abi|modules_execution)$" --output-on-failure
      - name: Preserve readable source and pinned dependencies
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          root=Path.cwd();out=root/'build';out.mkdir(exist_ok=True)
          for name,source in [('WinRecomp',root),('Zydis',root/'third_party/zydis'),('Zycore',root/'third_party/zydis/dependencies/zycore')]:
              subprocess.run(['git','-C',str(source),'bundle','create',str(out/(name+'.bundle')),'--all'],check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexed-windows-msvc
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/d3d9_indexed_program/acceptance.json
            build/d3d9_indexed_program/*/*/process.json
            build/d3d9_indexed_program/*/*/run.log
            build/d3d9_indexed_program/*/*/triangle.bin
            build/d3d9_texture_program/acceptance.json
            build/d3d9_program/acceptance.json
            build/WinRecomp.bundle
            build/Zydis.bundle
            build/Zycore.bundle
          retention-days: 14
  windows_memory:
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          submodules: false
      - run: git submodule update --init --recursive third_party/zydis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cmake -S . -B asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_CXX_FLAGS=/fsanitize=address /Zi" "-DCMAKE_EXE_LINKER_FLAGS=/INCREMENTAL:NO"
      - run: cmake --build asan --target winrecomp_indexed_geometry winrecomp_d3d9_indexed winrecomp_d3d9_textures winrecomp_d3d9_boundary winrecomp_gui_boundary winrecomp_dialog_boundary winrecomp_exception_unwind winrecomp_resource_tests --parallel 2
      - name: Native Windows index bounds and graphics lifetime checks
        run: ctest --test-dir asan -R "^(indexed_geometry|d3d9_indexed|d3d9_textures|d3d9_boundary|gui_boundary|dialog_boundary|exception_unwind|resources)$" --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexed-windows-asan
          path: asan/Testing/Temporary/LastTest.log
          retention-days: 14
