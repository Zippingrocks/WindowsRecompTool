name: Native Windows presentation verification
on:
  push:
    branches: [work/d3d9-present-publication]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: publish
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,subprocess
          from pathlib import Path
          patch_b64=''
          raw=gzip.decompress(base64.b64decode(patch_b64))
          assert hashlib.sha256(raw).hexdigest()=='d15491dcc142f6e33c47cf02666f1db26b62341773ef48ec8cfef270f21fa6cd'
          def git(*args,check=True):
              return subprocess.run(['git',*args],check=check,capture_output=True).stdout
          base='c033f100fe5730908a42abdf66fc464a2abff443'
          git('checkout','-B','work/d3d9-present',base)
          p=subprocess.run(['git','apply','--index','--whitespace=error-all','-'],input=raw,check=True)
          expected={'include/winrecomp/d3d9_host.hpp','src/runtime/d3d9_host.cpp','src/runtime/directdraw.cpp','tests/d3d9_boundary.cpp'}
          changed=set(git('diff','--cached','--name-only').decode().splitlines())
          assert changed==expected,(changed,expected)
          record=Path('verification/source-hashes.json')
          data=json.loads(record.read_text())
          for name in expected:
              data['sha256'][name]=hashlib.sha256(Path(name).read_bytes()).hexdigest()
          record.write_text(json.dumps(data,indent=2)+'\n')
          git('add','verification/source-hashes.json')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat: add exact-size windowed D3D9 presentation','-m','Translate a primary-surface Blt from the bounded legacy profile into a real D3D9 swap-chain Present. Reject scaling, foreign roots, active scenes, invalid rectangles and effects. Add visible-window pixel checks without weakening prior offscreen tests.')
          sha=git('rev-parse','HEAD').decode().strip()
          git('push','origin','HEAD:refs/heads/work/d3d9-present')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('source_sha='+sha+'\n')
          print('Published '+sha)
  windows:
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          fetch-depth: 0
          submodules: false
      - run: git submodule update --init --recursive third_party/zydis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: python -m pip install unicorn==2.1.2
      - run: python tools/check_repository.py
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWINRECOMP_CONFORMANCE=ON
      - run: cmake --build build --parallel 2
      - name: Real window presentation boundary
        run: ctest --test-dir build -R "^(d3d9_boundary)$" --output-on-failure
      - name: Retain depth/indexed/texture and runtime acceptance
        run: ctest --test-dir build -R "^(d3d9_depth|d3d9_indexed|d3d9_textures|d3d9_depth_program|d3d9_indexed_program|d3d9_texture_program|d3d9_program|gui_boundary|dialog_boundary|resources|exception_unwind|core|processor|modules|process|runtime|callback_abi|modules_execution)$" --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: present-windows-msvc
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          retention-days: 14
  windows_memory:
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          submodules: false
      - run: git submodule update --init --recursive third_party/zydis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cmake -S . -B asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_CXX_FLAGS=/fsanitize=address /Zi" "-DCMAKE_EXE_LINKER_FLAGS=/INCREMENTAL:NO"
      - run: cmake --build asan --target winrecomp_d3d9_boundary winrecomp_d3d9_depth winrecomp_d3d9_indexed winrecomp_d3d9_textures winrecomp_gui_boundary winrecomp_dialog_boundary winrecomp_exception_unwind winrecomp_resource_tests --parallel 2
      - name: Presentation and graphics lifetime checks
        run: ctest --test-dir asan -R "^(d3d9_boundary|d3d9_depth|d3d9_indexed|d3d9_textures|gui_boundary|dialog_boundary|exception_unwind|resources)$" --output-on-failure
