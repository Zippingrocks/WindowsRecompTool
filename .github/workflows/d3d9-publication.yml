name: Native Windows D3D7-on-D3D9 verification
on:
  push:
    branches: [work/d3d9-publication]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Verify owned-source repair
        shell: python
        run: |
          import hashlib,subprocess,os
          from pathlib import Path
          patch=subprocess.check_output(['git','show','HEAD:publication/d3d9-identity.patch'])
          if len(patch)>1048576 or hashlib.sha256(patch).hexdigest()!='3b3eab8c9bee463dff22522ed84809578f41b1aa45f36d43b82d2de1564aa893': raise RuntimeError('Patch mismatch')
          Path(os.environ['RUNNER_TEMP'],'d3d9.patch').write_bytes(patch)
      - name: Publish readable implementation on development branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/d3d9-source" 30bb54c581a38449a95b6f5b17bedfc0378427ff
          cd "$RUNNER_TEMP/d3d9-source"
          git apply --index "$RUNNER_TEMP/d3d9.patch"
          python - <<'PY'
          import subprocess,json,hashlib
          expected={'src/runtime/directdraw.cpp','src/runtime/directdraw_d3d9.hpp','verification/source-hashes.json'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if changed!=expected: raise RuntimeError('Unexpected source paths')
          hashes=json.loads(subprocess.check_output(['git','show',':verification/source-hashes.json']))['sha256']
          if len(hashes)!=93: raise RuntimeError('Unexpected source count')
          for name,want in hashes.items():
              if hashlib.sha256(subprocess.check_output(['git','show',':'+name])).hexdigest()!=want: raise RuntimeError(name)
          print('All 93 canonical source hashes verified before publication')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: retain controlling DirectDraw identity references used for cooperative-window lookup' -m 'Do not retain bare pointers after releasing their identity references. Keep ownership until backend teardown, after devices and surfaces. The original native failed test and all original-versus-generated assertions remain unchanged. Windows cross-compilation passed; native acceptance follows. No gameplay claim.'
          git push origin HEAD:refs/heads/work/d3d9-backend
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          fetch-depth: 0
          submodules: false
      - run: git submodule update --init --recursive third_party/zydis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: python -m pip install unicorn==2.1.2
      - run: python tools/check_repository.py
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWINRECOMP_CONFORMANCE=ON
      - name: Compile current source
        id: compile
        run: cmake --build build --parallel 2
      - name: Native Windows legacy7-on9 boundary and original x86 comparison
        if: runner.os == 'Windows'
        run: ctest --test-dir build -R "^(d3d9_boundary|d3d9_program)$" --output-on-failure
      - name: Native Windows directly affected runtime and modal regressions
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.compile.outcome == 'success' }}
        run: ctest --test-dir build -R "^(dialog_template|dialog_boundary|dialog_program|gui_boundary|window_program|exception_unwind|resources|callback_abi|core|runtime|process|modules)$" --output-on-failure
      - name: All Linux-compatible regressions
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure
      - name: Native i386 oracle
        if: runner.os == 'Linux'
        run: python tests/hardware_oracle.py --tool build/winrecomp --out build/hardware --vectors 64
      - name: Preserve exact source and dependencies
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p build
          git bundle create build/WinRecomp.bundle --all
          git -C third_party/zydis bundle create "$GITHUB_WORKSPACE/build/Zydis.bundle" --all
          git -C third_party/zydis/dependencies/zycore bundle create "$GITHUB_WORKSPACE/build/Zycore.bundle" --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3d9-${{ matrix.os }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/d3d9_program/acceptance.json
            build/d3d9_program/process.json
            build/d3d9_program/original-d3d7/triangle.bin
            build/d3d9_program/generated-d3d9/triangle.bin
            build/d3d9_program/*.log
            build/*/report.json
            build/*/hardware-report.json
            build/WinRecomp.bundle
            build/Zydis.bundle
            build/Zycore.bundle
          retention-days: 14
  windows_memory:
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          submodules: false
      - run: git submodule update --init --recursive third_party/zydis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure all native C++ with AddressSanitizer
        run: cmake -S . -B asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_CXX_FLAGS=/fsanitize=address /Zi" "-DCMAKE_EXE_LINKER_FLAGS=/INCREMENTAL:NO"
      - run: cmake --build asan --target winrecomp_d3d9_boundary winrecomp_exception_unwind winrecomp_resource_tests --parallel 2
      - name: Native Windows GPU bridge lifetime and fault checks
        run: ctest --test-dir asan -R "^(d3d9_boundary|exception_unwind|resources)$" --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3d9-windows-asan
          path: asan/Testing/Temporary/LastTest.log
          retention-days: 14
