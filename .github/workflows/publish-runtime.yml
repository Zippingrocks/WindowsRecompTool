name: Runtime source publication and verification
on:
  push:
    branches: [work/runtime-checkpoint]
    paths: [.runtime-bootstrap/publish.json]
permissions:
  contents: read
jobs:
  hydrate:
    if: ${{ contains(github.event.head_commit.message, '[source-transfer]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Verify immutable snapshot before writing source
        run: python .runtime-bootstrap/apply.py
      - name: Commit exact validated source to the development branch
        id: publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish verified-source runtime candidate'
          git push origin HEAD:work/runtime-checkpoint
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: hydrate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.hydrate.outputs.source_sha }}
          fetch-depth: 0
          submodules: false
      - name: Initialize only the production decoder dependency
        run: git submodule update --init --recursive third_party/zydis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install separate test oracle
        run: python -m pip install unicorn==2.1.2
      - name: Verify source policy and dependency pins
        run: python tools/check_repository.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWINRECOMP_CONFORMANCE=ON
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Test parser, CFG and generated x64 behavior
        run: ctest --test-dir build --output-on-failure
      - name: Check against actual i386 instructions
        if: runner.os == 'Linux'
        run: python tests/hardware_oracle.py --tool build/winrecomp --out build/hardware --vectors 64
      - name: Preserve source history for offline workspaces
        if: runner.os == 'Linux'
        run: |
          git bundle create build/WinRecomp.bundle --all
          git -C third_party/zydis bundle create "$GITHUB_WORKSPACE/build/Zydis.bundle" --all
          git -C third_party/zydis/dependencies/zycore bundle create "$GITHUB_WORKSPACE/build/Zycore.bundle" --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            build/conformance/report.json
            build/controlflow/report.json
            build/floating/report.json
            build/simd/report.json
            build/abi_callbacks/report.json
            build/program/acceptance.json
            build/hardware/hardware-report.json
            build/Testing/Temporary/LastTest.log
            build/WinRecomp.bundle
            build/Zydis.bundle
            build/Zycore.bundle
          retention-days: 14
          if-no-files-found: warn
