name: Native Windows adapter-selection verification
on:
  push:
    branches: [work/d3d9-adapter-selection]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: false
      - run: git submodule update --init --recursive third_party/zydis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: python tools/check_repository.py
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target winrecomp_directdraw_boundary winrecomp_d3d9_alpha_test winrecomp_d3d9_blending winrecomp_d3d9_combined --parallel 2
      - name: Adapter mapping plus retained renderer checks
        run: ctest --test-dir build -R "^(directdraw_boundary|d3d9_alpha_test|d3d9_blending|d3d9_combined)$" --output-on-failure
  windows_memory:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: false
      - run: git submodule update --init --recursive third_party/zydis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cmake -S . -B asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_CXX_FLAGS=/fsanitize=address /Zi" "-DCMAKE_EXE_LINKER_FLAGS=/INCREMENTAL:NO"
      - run: cmake --build asan --target winrecomp_directdraw_boundary --parallel 2
      - name: Adapter mapping ASan boundary
        run: ctest --test-dir asan -R "^directdraw_boundary$" --output-on-failure
