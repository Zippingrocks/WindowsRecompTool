name: Build and conformance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Initialize only the production decoder dependency
        run: git submodule update --init --recursive third_party/zydis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install separate test oracle
        run: python -m pip install unicorn==2.1.2
      - name: Verify source policy and dependency pins
        run: python tools/check_repository.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWINRECOMP_CONFORMANCE=ON
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Test parser, CFG and generated x64 behavior
        run: ctest --test-dir build --output-on-failure
      - name: Check against actual i386 instructions
        if: runner.os == 'Linux'
        run: python tests/hardware_oracle.py --tool build/winrecomp --out build/hardware --vectors 64
      - name: Preserve source history for offline workspaces
        if: runner.os == 'Linux'
        run: git bundle create build/WinRecomp.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            build/conformance/report.json
            build/hardware/hardware-report.json
            build/Testing/Temporary/LastTest.log
            build/WinRecomp.bundle
          retention-days: 14
          if-no-files-found: warn
