name: Native Windows legacy D3D9 backend
on:
  push:
    branches: [work/d3d9-backend]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
      - run: git submodule update --init --recursive third_party/zydis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: python -m pip install unicorn==2.1.2
      - run: python tools/check_repository.py
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWINRECOMP_CONFORMANCE=ON
      - name: Compile all current sources
        id: compile
        run: cmake --build build --parallel 2
      - name: Original x86 D3D7 versus recompiled x64 D3D9 and GPU boundary
        if: runner.os == 'Windows'
        run: ctest --test-dir build -R "^(d3d9_boundary|d3d9_program)$" --output-on-failure
      - name: Native Windows affected GUI and default DirectDraw regressions
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.compile.outcome == 'success' }}
        run: ctest --test-dir build -R "^(dialog_template|dialog_boundary|dialog_program|gui_boundary|window_program|exception_unwind|resources|callback_abi|core|runtime|process|modules|directdraw_boundary|directdraw_program)$" --output-on-failure
      - name: Retain unchanged display-mode failure observations
        if: always() && runner.os == 'Windows'
        shell: python
        run: |
          from pathlib import Path
          import struct,json
          rows={}
          for label in ('original','generated'):
              path=Path('build/directdraw_program',label,'modes.bin')
              if path.is_file():
                  data=path.read_bytes()
                  rows[label]={'bytes':len(data),'words':list(struct.unpack('<8I',data)) if len(data)==32 else None}
          print(json.dumps(rows,indent=2))
          Path('build/mode-observations.json').write_text(json.dumps(rows,indent=2)+'\n')
      - name: All Linux-compatible regressions
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure
      - name: Original native i386 oracle
        if: runner.os == 'Linux'
        run: python tests/hardware_oracle.py --tool build/winrecomp --out build/hardware --vectors 64
      - name: Preserve source and pinned dependencies
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p build
          git bundle create build/WinRecomp.bundle --all
          git -C third_party/zydis bundle create "$GITHUB_WORKSPACE/build/Zydis.bundle" --all
          git -C third_party/zydis/dependencies/zycore bundle create "$GITHUB_WORKSPACE/build/Zycore.bundle" --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3d9-${{ matrix.os }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/d3d9_program/acceptance.json
            build/d3d9_program/process.json
            build/d3d9_program/original-d3d7/triangle.bin
            build/d3d9_program/generated-d3d9/triangle.bin
            build/d3d9_program/*.log
            build/directdraw_program/original/modes.bin
            build/directdraw_program/generated/modes.bin
            build/directdraw_program/original/surface.bin
            build/directdraw_program/generated/surface.bin
            build/directdraw_program/process.json
            build/mode-observations.json
            build/*/report.json
            build/*/acceptance.json
            build/*/hardware-report.json
            build/WinRecomp.bundle
            build/Zydis.bundle
            build/Zycore.bundle
          retention-days: 14
  windows_memory:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: false
      - run: git submodule update --init --recursive third_party/zydis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure all native C++ with AddressSanitizer
        run: cmake -S . -B asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_CXX_FLAGS=/fsanitize=address /Zi" "-DCMAKE_EXE_LINKER_FLAGS=/INCREMENTAL:NO"
      - run: cmake --build asan --target winrecomp_d3d9_boundary winrecomp_directdraw_boundary winrecomp_exception_unwind winrecomp_resource_tests --parallel 2
      - name: Native GPU, default DirectDraw and memory failure-path checks
        run: ctest --test-dir asan -R "^(d3d9_boundary|directdraw_boundary|exception_unwind|resources)$" --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3d9-windows-asan
          path: asan/Testing/Temporary/LastTest.log
          retention-days: 14
